apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-digital-twin
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devops-digital-twin
  template:
    metadata:
      labels:
        app: devops-digital-twin
    spec:
      containers:
        - name: devops-digital-twin-app
          image: devops-digital-twin-app:phase7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi