apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
    component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: devops-digital-twin
        metrics_path: /metrics
        static_configs:
          - targets:
              - devops-digital-twin-service:8000

      - job_name: kubernetes-cadvisor
        scheme: https
        metrics_path: /api/v1/nodes/desktop-control-plane/proxy/metrics/cadvisor
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        static_configs:
          - targets:
              - kubernetes.default.svc:443