apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: default
  labels:
    app: prometheus
    component: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-cadvisor-reader
  labels:
    app: prometheus
    component: monitoring
rules:
  - apiGroups:
      - ""
    resources:
      - nodes/proxy
    resourceNames:
      - desktop-control-plane
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-cadvisor-reader
  labels:
    app: prometheus
    component: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-cadvisor-reader
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: default
